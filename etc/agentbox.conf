# agentbox host defaults. Copy to $AGENTBOX_HOME/agentbox.conf to override,
# or export AGENTBOX_* in your shell. Per-box values live in boxes/<n>/box.conf.

# --- base image -------------------------------------------------------------
AGENTBOX_RELEASE=24.04            # Ubuntu cloud image release used for the base
AGENTBOX_BASE_DISK_GB=20          # virtual size of the base image
AGENTBOX_NODE_MAJOR=22           # Node.js major version installed in the guest

# --- per-box defaults -------------------------------------------------------
AGENTBOX_CPUS=4
AGENTBOX_MEM_MB=4096
AGENTBOX_NET=slirp                # slirp (no privileges) | bridge (needs `agentbox net up`)
AGENTBOX_EGRESS=open              # open | allow | proxy | none  (bridge mode only)

# Credential handling. 'none' (the default) copies nothing into a box: agents
# start logged out, and you either log in inside the box or hand it a token
# deliberately with `agentbox creds <box> push`. 'share' copies the host's
# Claude OAuth token into each new box so agents are logged in immediately --
# convenient, but the box can then act as you: isolation bounds what an agent
# reaches, not what it does with a token you gave it.
AGENTBOX_CREDS=none               # none | share

# --- bridge-mode network ----------------------------------------------------
AGENTBOX_BRIDGE=agbr0
AGENTBOX_SUBNET=10.77.0
AGENTBOX_HOST_IP=10.77.0.1
AGENTBOX_DNS=10.77.0.1            # host-side dnsmasq resolver for guests

# --- slirp-mode ssh port range ---------------------------------------------
AGENTBOX_SSH_PORT_BASE=2220
